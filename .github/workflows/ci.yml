name: CI

on:
  push:
    branches: [main, dev-demi]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: segur
          POSTGRES_PASSWORD: segur
          POSTGRES_DB: segur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://segur:segur@localhost:5432/segur_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      JOB_SECRET: ci-job-secret-with-at-least-32-characters
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: Segur CI <no-reply@example.com>
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run ts

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Test
        run: bun test
