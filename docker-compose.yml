services:
  postgres:
    image: postgres:16-alpine
    container_name: segur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: segur
      POSTGRES_PASSWORD: segur
      POSTGRES_DB: segur_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
